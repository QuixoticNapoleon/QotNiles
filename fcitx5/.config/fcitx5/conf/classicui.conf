# Force the dark theme for the candidate window / popup.
# default-dark ships with fcitx5 (in /usr/share/fcitx5/themes/).
Theme=default-dark

# Theme used when following the system light/dark scheme (below).
DarkTheme=default-dark

# Keep False so Theme= above always wins. Set True to follow the system
# color-scheme (needs an org.freedesktop.appearance portal).
UseDarkTheme=False

# Follow system accent color if the theme/desktop supports it.
UseAccentColor=True
